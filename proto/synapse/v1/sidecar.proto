syntax = "proto3";

package synapse.v1;

option go_package = "github.com/Team-Deepiri/deepiri-sugar-glider/proto/synapse/v1;synapsev1";

service SynapseSidecar {
  rpc Publish(PublishRequest) returns (PublishResponse);
  rpc PublishBatch(PublishBatchRequest) returns (PublishBatchResponse);
  rpc Subscribe(SubscribeRequest) returns (stream Event);
  rpc Ack(AckRequest) returns (AckResponse);
  rpc StreamInfo(StreamInfoRequest) returns (StreamInfoResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  // ReplayDLQ requeues entries from a DLQ stream back onto a target stream.
  rpc ReplayDLQ(ReplayDLQRequest) returns (ReplayDLQResponse);
}

message PublishRequest {
  string stream = 1;
  string event_type = 2;
  string sender = 3;
  string recipient = 4;
  string priority = 5;
  bytes payload = 6;
  int32 ttl_sec = 7;
}

message PublishResponse {
  string entry_id = 1;
  // queued is true when Redis was unavailable and the event was written to local WAL.
  bool queued = 2;
}

message PublishBatchRequest {
  string stream = 1;
  repeated PublishRequest events = 2;
}

message PublishBatchResponse {
  repeated string entry_ids = 1;
}

message SubscribeRequest {
  string stream = 1;
  string consumer_group = 2;
  string consumer_name = 3;
  int32 batch_size = 4;
}

message Event {
  string stream = 1;
  string entry_id = 2;
  string event_type = 3;
  string sender = 4;
  bytes payload = 5;
  string timestamp = 6;
}

message AckRequest {
  string stream = 1;
  string consumer_group = 2;
  repeated string entry_ids = 3;
}

message AckResponse {
  int32 acked = 1;
}

message StreamInfoRequest {
  string stream = 1;
}

message StreamInfoResponse {
  int64 length = 1;
  int32 groups = 2;
  string first_entry_id = 3;
  string last_entry_id = 4;
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  string redis_status = 2;
}

message ReplayDLQRequest {
  string dlq_stream = 1;
  // Optional override; defaults to each entry's dlq_original_stream field.
  string target_stream = 2;
  int32 count = 3;
  string start = 4;
  string end = 5;
  // When true, successfully requeued DLQ entries are deleted from the DLQ stream.
  bool delete_from_dlq = 6;
}

message ReplayDLQResponse {
  int32 replayed = 1;
  int32 skipped = 2;
  repeated string entry_ids = 3;
}
